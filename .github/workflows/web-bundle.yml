name: Save the deployed web bundle
run-name: Save the deployed web bundle

# Room decision 4, docs/OLD-CLIENT.md. After each successful production deploy of talos-app, build the web app at the
# deployed sha exactly as apps/relay/Dockerfile does and save it as a prerelease (never latest) named web-bundle-<sha8>.
# It holds only the built files and manifest.json (sha, version, deployed_at, file hashes): no source maps, no environment,
# no host. The newest 3 are kept, newest by when they were published, so a redeploy of an older sha (a rollback) is saved
# again and becomes the newest (a sha from 2026-11-18 on: an older one has no web-bundle-deploy.yml that starts this). The
# gate's old-client step (scripts/old-client.sh) runs today's relay and bridge against the newest one.
#
# Three jobs, so no code from the repository or its dependencies ever runs where the write token is:
#   build    read-only token: checkout, install, build, manifest, personal-data scan, save the two files to the Actions cache
#   publish  contents: write, no checkout and no install: restore the files from the cache, replace the release, keep 3, then
#            delete the cache entry (actions: write): the release is the copy old-client.sh reads. The cache, not a workflow
#            artifact, carries the files between the jobs: the artifact storage quota is account-wide and was full on 2026-11-14
#   specs    read-only token: the old-client specs on the new bundle with its own relay (a red is about the specs)
#   report   statuses: write: posts `web-bundle/save` on the deployed commit: success only when every job succeeded (a red
#            old-client spec included), else failure, so a broken save or a broken old client is seen
#            (publish failed silently from 2026-11-16 to 11-17 and old-client went on testing an older bundle)
# Started by web-bundle-deploy.yml when it sees a successful production deploy (workflow_dispatch with the deployed sha: a
# deployment_status run has no ref and a workflow_run run gets the cache read-only, so neither can carry the bundle), or by
# hand the same way for a deploy a failed run missed. resolve takes only the live production deploy. Never by a pull request.
# Only build saves to the cache, and only a commit on main (its check comes first).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: A deployed commit (40 hex) whose bundle to save
        required: true

permissions: {}

# One save at a time; a newer pending one replaces an older pending one, which is no longer the live deploy anyway
concurrency:
  group: web-bundle
  cancel-in-progress: false

jobs:
  # The sha and when it was deployed, from GitHub's own deployment record: the newest successful production deploy of it.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: read
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      deployed_at: ${{ steps.r.outputs.deployed_at }}
    env:
      SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: r
        name: The deployed sha and its deploy time
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit sha"; exit 1; }
          at=""
          for id in $(gh api "repos/$GH_REPO/deployments?sha=$SHA&environment=talos-app%20%2F%20production&per_page=20" --jq '.[].id'); do
            t="$(gh api "repos/$GH_REPO/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success") | .created_at] | max // empty')"
            if [ -n "$t" ] && [[ "$t" > "$at" ]]; then at="$t"; fi
          done
          [ -n "$at" ] || { echo "${SHA:0:8} has no successful production deploy"; exit 1; }
          # only what is live: the newest successful production deploy must be this sha, or the saved "newest" bundle would
          # be one no phone loads (and keep-3 could delete the live one)
          live=""
          live_at=""
          for row in $(gh api "repos/$GH_REPO/deployments?environment=talos-app%20%2F%20production&per_page=100" --jq '.[] | "\(.id),\(.sha)"'); do
            t="$(gh api "repos/$GH_REPO/deployments/${row%%,*}/statuses?per_page=100" --jq '[.[] | select(.state == "success") | .created_at] | max // empty')"
            if [ -n "$t" ] && [[ "$t" > "$live_at" ]]; then live_at="$t"; live="${row#*,}"; fi
          done
          [ "$live" = "$SHA" ] || { echo "${SHA:0:8} is not the live production deploy (${live:0:8} is): not saved"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$at" >> "$GITHUB_OUTPUT"
          echo "${SHA:0:8} deployed at $at"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      DEPLOYED_AT: ${{ needs.resolve.outputs.deployed_at }}
    steps:
      - name: Check the event's values
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit sha"; exit 1; }
          [[ "$DEPLOYED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || { echo "not an ISO time"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Only a commit on main is saved as live
        run: git merge-base --is-ancestor "$SHA" origin/main || { echo "${SHA:0:8} is not on main"; exit 1; }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; version comes from "packageManager" in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter @talos-app/web...

      - name: Build the web app as the Dockerfile does (the version is the deploy's short sha, as on Railway)
        shell: bash
        run: |
          set -euo pipefail
          ver="${SHA:0:7}"
          APP_VERSION="$ver" VITE_APP_VERSION="$ver" pnpm --filter @talos-app/web build
          grep -rqF "$ver" apps/web/dist/assets || { echo "the build does not carry its version $ver"; exit 1; }
          mkdir -p out/web
          cp -R apps/web/dist/. out/web/
          find out/web \( -name '*.map' -o -name '*.md' \) -delete
          node scripts/web-bundle-manifest.mjs make out/web "$SHA" "$ver" "$DEPLOYED_AT" > out/manifest.json
          tar -czf out/web-bundle.tar.gz --owner=0 --group=0 --numeric-owner -C out/web .
          echo "web-bundle-${SHA:0:8}: $(jq '.files | length' out/manifest.json) files"

      # The generic rules over what this job writes (the manifest, the release's name and notes) and every bundle file
      # outside the hashed assets/. Those are compiled from sources every push already scans, and their minified text
      # throws up random look-alikes (an "email" made of base64), so they are left out.
      - name: No personal data in what is published
        shell: bash
        run: |
          set -euo pipefail
          scan="$(mktemp -d)"
          mkdir "$scan/web"
          (cd out/web && find . -path ./assets -prune -o -type f -print | cpio -pdm --quiet "$scan/web")
          cp out/manifest.json "$scan/"
          printf 'web-bundle-%s\nweb bundle %s\nThe web bundle as deployed. manifest.json: sha, version, deployed_at, file hashes.\n' \
            "${SHA:0:8}" "${SHA:0:8}" > "$scan/release.txt"
          git -C "$scan" init -q
          CHECK_EXTRA_RULES= bash scripts/check-no-personal.sh "$scan"

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true # a failed save is a warning here; publish then fails on its cache miss
        with:
          path: |
            out/web-bundle.tar.gz
            out/manifest.json
          key: web-bundle-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create and delete the web-bundle-* prereleases
      actions: write # delete this run's cache entry (no code of the repository runs in this job)
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            out/web-bundle.tar.gz
            out/manifest.json
          key: web-bundle-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Publish the prerelease (a redeploy of a saved sha replaces it, so it is the newest again)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit sha"; exit 1; }
          tag="web-bundle-${SHA:0:8}"
          jq -e --arg sha "$SHA" '.sha == $sha' out/manifest.json >/dev/null || { echo "the cached bundle is not this deploy's"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then gh release delete "$tag" --cleanup-tag --yes </dev/null; fi
          gh release create "$tag" out/web-bundle.tar.gz out/manifest.json --prerelease --latest=false --target "$SHA" \
            --title "web bundle ${SHA:0:8}" \
            --notes "The web bundle as deployed. manifest.json: sha, version, deployed_at, file hashes."

      - name: Keep the newest 3, and no leftover drafts
        shell: bash
        run: |
          set -euo pipefail
          list="$(gh release list --limit 100 --json tagName,isPrerelease,isDraft,publishedAt)"
          # a draft whose tag a published release also has is left alone: deleting by tag could hit the published one
          jq -r '(map(select(.isDraft | not) | .tagName)) as $pub
                 | .[] | select(.isDraft and (.tagName | test("^web-bundle-[0-9a-f]{8}$")) and ((.tagName | IN($pub[])) | not))
                 | .tagName' <<<"$list" |
            while read -r t; do gh release delete "$t" --yes </dev/null; done
          jq -r '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | test("^web-bundle-[0-9a-f]{8}$")))]
                 | sort_by(.publishedAt) | reverse | .[3:] | .[].tagName' <<<"$list" |
            while read -r t; do gh release delete "$t" --cleanup-tag --yes </dev/null; done

      # The release holds the files now: the cache entry (about 5 MB) is deleted at once. After a failed publish it stays, so
      # "Re-run failed jobs" can still publish it: a re-run keeps the run_id (build is not re-run), so the key still matches.
      - name: Delete this run's cache entry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GH_REPO/actions/caches?key=web-bundle-${SHA}-${RUN_ID}" </dev/null && echo "deleted cache entry web-bundle-${SHA}-${RUN_ID}"

  specs:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; version comes from "packageManager" in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: The old-client specs on the new bundle, with its own relay and bridge
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          ver="${SHA:0:7}"
          APP_VERSION="$ver" VITE_APP_VERSION="$ver" pnpm --filter @talos-app/web build
          mkdir -p out/web && cp -R apps/web/dist/. out/web/ && find out/web \( -name '*.map' -o -name '*.md' \) -delete
          OLD_CLIENT_BUNDLE=out/web OLD_CLIENT_STRICT=1 bash scripts/old-client.sh

  report:
    needs: [resolve, build, publish, specs]
    if: always() # resolve failing (the GitHub API, or not the live deploy) is said too
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write # post web-bundle/save on the deployed commit (no code of the repository runs in this job)
    env:
      SHA: ${{ inputs.sha }}
      RESOLVE: ${{ needs.resolve.result }}
      BUILD: ${{ needs.build.result }}
      PUBLISH: ${{ needs.publish.result }}
      SPECS: ${{ needs.specs.result }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Say on the commit whether its bundle was saved
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit sha"; exit 1; }
          # success only when every job did: a red old-client spec is a red status, never a footnote in a green one
          state=failure
          [ "$RESOLVE" = success ] && [ "$BUILD" = success ] && [ "$PUBLISH" = success ] && [ "$SPECS" = success ] && state=success
          desc="web-bundle-${SHA:0:8}: resolve $RESOLVE, build $BUILD, publish $PUBLISH, old-client specs $SPECS"
          gh api -X POST "repos/$GH_REPO/statuses/$SHA" -f state="$state" -f context=web-bundle/save \
            -f description="$desc" -f target_url="$URL" </dev/null >/dev/null
          echo "$state: $desc"
