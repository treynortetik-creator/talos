# Single source of truth for the Xcode project. Generate with `pnpm --filter @talos-app/mobile xcodegen`
# (needs `brew install xcodegen`). App/Info.plist and App.xcodeproj are generated from this file: never hand-edit them.
#
# Deliberately absent: the push entitlement and Associated Domains from the default build (both need the paid Apple program, and a free Personal
# Team cannot sign them; they live only in AppPush.entitlements), and any signing identity or team. The default entitlement is Keychain sharing
# (free tier), written with the build-time team prefix variable. Push is an opt-in: with the paid program, put
# `TALOS_APP_ENTITLEMENTS = App/AppPush.entitlements` in the untracked ios/Local.xcconfig (see Signing.xcconfig). Bundle ids
# are placeholders.
name: App
options:
  bundleIdPrefix: app.talos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../Signing.xcconfig
  Release: ../Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    # Build number: scripts/testflight.sh passes CURRENT_PROJECT_VERSION=<UTC timestamp> on the command line, so this
    # default is only for local builds. Never edit it per upload.
    CURRENT_PROJECT_VERSION: "1"
packages:
  CapApp-SPM:
    path: CapApp-SPM
  BridgeGuard:
    path: ../BridgeGuard
  TalosAudioCore:
    path: ../TalosAudioCore
  TalosShareCore:
    path: ../TalosShareCore
  TalosPushCore:
    path: ../TalosPushCore
  TalosCrashCore:
    path: ../TalosCrashCore
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - public
          - config.xml
          - capacitor.config.json
          - Info.plist
          - App.entitlements
          - AppPush.entitlements
      - path: ../TalosShareShared
      - path: ../TalosPushShared
      - path: App/public
        type: folder
        buildPhase: resources
      - path: App/capacitor.config.json
        buildPhase: resources
        optional: true
      - path: App/config.xml
        buildPhase: resources
        optional: true
    dependencies:
      - package: CapApp-SPM
        product: CapApp-SPM
      - package: BridgeGuard
        product: BridgeGuard
      - package: TalosAudioCore
        product: TalosAudioCore
      - package: TalosShareCore
        product: TalosShareCore
      - package: TalosPushCore
        product: TalosPushCore
      - package: TalosCrashCore
        product: TalosCrashCore
      - target: TalosShareExtension
        embed: true
      - target: TalosPushExtension
        embed: true
    # The entitlements file is NOT generated for this target (a generated one would pin CODE_SIGN_ENTITLEMENTS and a
    # paid-program build could not swap it): App/App.entitlements (default, Keychain sharing only, free-tier) and
    # App/AppPush.entitlements (opt-in) are committed files, chosen by TALOS_APP_ENTITLEMENTS in Signing.xcconfig.
    # The Keychain prefix is the signing team's, resolved at build time: no Team ID is committed.
    info:
      path: App/Info.plist
      properties:
        CAPACITOR_DEBUG: $(CAPACITOR_DEBUG)
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Talos
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Voice replies keep playing when the phone locks. Not "remote-notification": alert pushes need no background mode.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UIRequiredDeviceCapabilities: [arm64]
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        # Microphone for voice input in the web app. Text only; no Apple team or personal data.
        NSMicrophoneUsageDescription: Talos uses the microphone for voice messages you record.
        # Composer "Take photo" (<input capture>) opens the camera; iOS kills the app without this key.
        NSCameraUsageDescription: Talos uses the camera when you take a photo to attach to a message.
        # Long-press "Save to Photos" on an image.
        TalosKeychainGroup: $(AppIdentifierPrefix)app.talos.shared
        NSPhotoLibraryAddUsageDescription: Talos saves images to your photo library when you choose Save to Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TALOS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        # Default App/App.entitlements (no push); a paid-program build overrides it in Local.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(TALOS_APP_ENTITLEMENTS)
      configs:
        Debug:
          CAPACITOR_DEBUG: "true"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          CAPACITOR_DEBUG: "false"
  # Runs inside the app on the simulator, against the real Keychain: what the Swift packages cannot reach (see AppTests).
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../AppTests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TALOS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  TalosShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../TalosShareExtension
        excludes:
          - Info.plist
          - TalosShareExtension.entitlements
      - path: ../TalosShareShared
    dependencies:
      - package: TalosShareCore
        product: TalosShareCore
    entitlements:
      path: ../TalosShareExtension/TalosShareExtension.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)app.talos.shared"]
    info:
      path: ../TalosShareExtension/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Talos
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TalosKeychainGroup: $(AppIdentifierPrefix)app.talos.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TALOS_BUNDLE_ID).share
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # Opens the seal on an iPhone push (docs/IOS-PUSH.md "Message text and quick actions"). Keychain sharing only; it needs no paid
  # capability of its own, and it falls back to the push exactly as Apple delivered it when anything is missing.
  TalosPushExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../TalosPushExtension
        excludes:
          - Info.plist
          - TalosPushExtension.entitlements
      - path: ../TalosPushShared
    dependencies:
      - package: TalosPushCore
        product: TalosPushCore
    entitlements:
      path: ../TalosPushExtension/TalosPushExtension.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)app.talos.shared"]
    info:
      path: ../TalosPushExtension/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Talos
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TalosKeychainGroup: $(AppIdentifierPrefix)app.talos.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TALOS_BUNDLE_ID).push
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  App:
    build:
      targets:
        App: all
    test:
      targets:
        - AppTests
