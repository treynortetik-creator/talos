<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Talos</title>
    <style>
      body { font: 16px -apple-system, system-ui, sans-serif; background: #141110; color: #e8e8ee; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; text-align: center; }
      a.retry { display: inline-block; font: inherit; margin-top: 16px; padding: 12px 24px; border-radius: 999px; background: #e8e8ee; color: #0b0b0f; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>Talos can't connect right now.</p>
      <p>Check your connection. It will retry on its own when you're back online.</p>
      <!-- Handled natively by the app (a talos-retry link reloads it). A page-history back button does nothing after a cold launch. -->
      <a class="retry" href="talos-retry://now">Try again</a>
    </main>
  </body>
</html>
